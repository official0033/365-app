<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>365</title>
  </head>
  <body>
    <h1>365</h1>
    <p id="today">Today</p>
    <p id="progress"></p>
    <p id="streak"></p>
    <ul id="task-list">
    </ul>
    <input type="text" id="new-task" placeholder="Add a new task..." />
    <button id="add-btn">Add-Task</button>
    <section id="rest-section">
      <h2>Rest days</h2>
      <p id="rest-info"></p>
      <div id="rest-actions">
        <button id="rest-today-btn" class="rest-btn">Rest today</button>
        <button id="rest-tomorrow-btn" class="rest-btn">Rest tomorrow</button>
        <button id="rest-undo-btn" class="rest-btn" hidden>Undo tomorrow's rest</button>
      </div>
      <div id="rest-confirm" hidden>
        <p id="rest-msg"></p>
        <button id="rest-yes">Confirm</button>
        <button id="rest-no">Cancel</button>
      </div>
    </section>
    <script src="js/app.js"></script>
  </body>
</html>
